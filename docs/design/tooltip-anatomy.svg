  <!-- ===================== NOTES ===================== -->
  <line x1="40" y1="880" x2="1560" y2="880" stroke="#1E293B" stroke-width="1"/>
  <text x="40" y="906" fill="#94A3B8" font-size="10" font-family="ui-monospace, Menlo, monospace">CONTRAINTES FERMES</text>
  <text x="40" y="926" fill="#CBD5E1" font-size="11">· Largeur 320 px par défaut, redimensionnable 240–700 px · Liste max 200 px · Poignée 26×18 px dans le pied</text>
  <text x="40" y="944" fill="#CBD5E1" font-size="11">· Un seul bouton par ligne de menu · Drapeaux emoji · Aucune image bitmap dans la bulle · Aucun chargement réseau</text>
  <text x="40" y="962" fill="#CBD5E1" font-size="11">· Texte ≥ 11 px · Contraste ≥ 4,5:1 (texte) et 3:1 (interactif) · Focus visible 2 px + offset 2 px</text>
  <text x="40" y="980" fill="#CBD5E1" font-size="11">· Animations 120–160 ms, coupées sous « prefers-reduced-motion » · Chiffres tabulaires pour les valeurs</text>

  <text x="40" y="1016" fill="#94A3B8" font-size="10" font-family="ui-monospace, Menlo, monospace">CALQUES ATTENDUS</text>
  <text x="40" y="1036" fill="#CBD5E1" font-size="11" font-family="ui-monospace, Menlo, monospace">Bubble/&lt;state&gt;/&lt;theme&gt; · Picker/&lt;kind&gt; · Search · List/Section/Row/&lt;id&gt;/&lt;state&gt; · Footer/Resize</text>
  <text x="40" y="1054" fill="#CBD5E1" font-size="11" font-family="ui-monospace, Menlo, monospace">Settings/&lt;section&gt; · Popup/&lt;state&gt; · Icon/&lt;size&gt;</text>

  <text x="40" y="1100" fill="#64748B" font-size="10">UniConv 1.0.0 — planche de référence pour la conception. Les valeurs sont remplaçables : voir docs/design/tokens.json.</text>
