<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapport de bug — UniConv</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe3ef;
      --accent: #1d4ed8;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    header img { width: 32px; height: 32px; }
    h1 { margin: 0; font-size: 22px; }
    .lead { margin: 6px 0 0; color: var(--muted); }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
    .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .value { overflow-wrap: anywhere; }
    .preview {
      display: block;
      max-width: 100%;
      max-height: 420px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    pre {
      margin: 6px 0 0;
      padding: 10px;
      border-radius: 6px;
      background: #f1f5f9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      max-height: 220px;
      overflow: auto;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button, a.button {
      appearance: none;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 8px 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    button.secondary, a.button.secondary {
      background: #fff;
      color: var(--accent);
    }
    button:hover, a.button:hover { filter: brightness(1.05); }
    .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .error { color: #b91c1c; font-weight: 600; }
    @media (max-width: 640px) {
      body { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="pixel-theme.css">
</head>
<body>
  <div class="wrap">
    <header>
      <img src="../icons/icon48.png" alt="">
      <div>
        <h1>Rapport de bug</h1>
        <p class="lead">Zone capturée et diagnostics UniConv. Aucun envoi réseau.</p>
      </div>
    </header>

    <div class="card" id="empty" hidden>
      <p class="error">Aucun rapport disponible. Relancez « Signaler un bug » depuis le clic droit.</p>
    </div>

    <div class="card">
      <div class="label">Zone capturée</div>
      <img class="preview" id="preview" alt="Zone capturée pour le rapport">
      <div class="actions">
        <button type="button" id="copy-report">Copier le rapport</button>
        <button type="button" class="secondary" id="copy-image">Copier l'image</button>
        <a class="button secondary" id="download-image" download="unicorn-bug.png">Télécharger l'image</a>
        <button type="button" class="secondary" id="clear-report">Supprimer le rapport</button>
      </div>
      <p class="note" id="copy-status" role="status"></p>
    </div>

    <div class="card">
      <div class="grid">
        <div><div class="label">Page</div><div class="value" id="page-url"></div></div>
        <div><div class="label">Titre</div><div class="value" id="page-title"></div></div>
        <div><div class="label">Date</div><div class="value" id="created"></div></div>
        <div><div class="label">Version</div><div class="value" id="version"></div></div>
        <div><div class="label">Zone</div><div class="value" id="rect"></div></div>
        <div><div class="label">Écran</div><div class="value" id="screen"></div></div>
        <div><div class="label">Confiance OCR</div><div class="value" id="confidence"></div></div>
        <div><div class="label">Navigateur</div><div class="value" id="ua"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="label">Texte OCR</div>
      <pre id="ocr-text"></pre>
      <div class="label" style="margin-top:12px">Texte HTML sous la zone</div>
      <pre id="page-text"></pre>
    </div>
  </div>
  <script src="report.js"></script>
</body>
</html>
