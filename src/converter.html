<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>UniConv — Convertisseur</title>
  <style>
    :root {
      --unicolor-border: #d8dde5;
      --unicolor-muted: #6b7280;
      --unicolor-accent: #2f6bff;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 100vh;
      margin: 0;
      padding: 16px 16px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: #111827;
      background: #f8fafc;
    }
    .page-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 16px; font-weight: 700; }
    .page-subtitle { color: var(--unicolor-muted); font-size: 12px; }
    .converter {
      padding: 12px;
      border: 1px solid var(--unicolor-border);
      border-radius: 8px;
      background: #ffffff;
    }
    .converter-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .converter-tab {
      flex: 1;
      padding: 5px 6px;
      border: 1px solid var(--unicolor-border);
      border-radius: 5px;
      background: #ffffff;
      color: #374151;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .converter-tab.active {
      border-color: var(--unicolor-accent);
      background: #eef3ff;
      color: var(--unicolor-accent);
    }
    .converter-label {
      display: block;
      margin: 8px 0 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--unicolor-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .converter-input, .converter-select {
      width: 100%;
      padding: 6px 7px;
      border: 1px solid var(--unicolor-border);
      border-radius: 5px;
      background: #ffffff;
      color: #111827;
      font: inherit;
      font-size: 13px;
    }
    .converter-row { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .converter-row .converter-select { flex: 1; min-width: 0; }
    .converter-swap {
      flex: none;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--unicolor-border);
      border-radius: 5px;
      background: #ffffff;
      color: var(--unicolor-accent);
      font-size: 15px;
      cursor: pointer;
    }
    .converter-swap:hover { background: #eef3ff; }
    .converter-result {
      display: block;
      margin-top: 10px;
      font-size: 20px;
      font-weight: 700;
      word-break: break-word;
    }
    .converter-detail { margin: 2px 0 0; min-height: 14px; font-size: 11px; color: var(--unicolor-muted); }
    .page-hint { margin: 12px 2px 0; font-size: 11.5px; color: var(--unicolor-muted); }
    .converter-tab:focus-visible, .converter-input:focus-visible,
    .converter-select:focus-visible, .converter-swap:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 1px;
    }
  </style>
  <link rel="stylesheet" href="pixel-theme.css">
</head>
<body>
  <header class="page-header">
    <h1>UniConv</h1>
    <span class="page-subtitle">Convertisseur</span>
  </header>

  <main>
    <section class="converter" aria-label="Convertisseur">
      <div class="converter-tabs" role="tablist" aria-label="Type de conversion">
        <button type="button" class="converter-tab active" id="tab-currency"
                role="tab" aria-selected="true" aria-controls="pane-currency">Devises</button>
        <button type="button" class="converter-tab" id="tab-unit"
                role="tab" aria-selected="false" aria-controls="pane-unit">Unites</button>
      </div>

      <div id="pane-currency" class="converter-pane" role="tabpanel" aria-labelledby="tab-currency">
        <label class="converter-label" for="conv-amount">Montant</label>
        <input class="converter-input" id="conv-amount" type="number"
               inputmode="decimal" step="any" min="0" value="1">
        <div class="converter-row">
          <select class="converter-select" id="conv-from" aria-label="Devise de depart"></select>
          <button type="button" class="converter-swap" id="conv-swap"
                  title="Inverser les devises" aria-label="Inverser les devises">&#8644;</button>
          <select class="converter-select" id="conv-to" aria-label="Devise d'arrivee"></select>
        </div>
        <output class="converter-result" id="conv-result"
                for="conv-amount conv-from conv-to">&#8212;</output>
        <p class="converter-detail" id="conv-detail"></p>
      </div>

      <div id="pane-unit" class="converter-pane" role="tabpanel" aria-labelledby="tab-unit" hidden>
        <label class="converter-label" for="unit-category">Categorie</label>
        <select class="converter-select" id="unit-category" aria-label="Categorie d'unite"></select>
        <label class="converter-label" for="unit-amount">Montant</label>
        <input class="converter-input" id="unit-amount" type="number"
               inputmode="decimal" step="any" value="1">
        <div class="converter-row">
          <select class="converter-select" id="unit-from" aria-label="Unite de depart"></select>
          <button type="button" class="converter-swap" id="unit-swap"
                  title="Inverser les unites" aria-label="Inverser les unites">&#8644;</button>
          <select class="converter-select" id="unit-to" aria-label="Unite d'arrivee"></select>
        </div>
        <output class="converter-result" id="unit-result"
                for="unit-amount unit-from unit-to">&#8212;</output>
      </div>
    </section>

    <p class="page-hint">
      Le montant est deja selectionne : tapez votre somme directement.
      Pour fermer, utilisez la croix de la fenetre.
    </p>
  </main>

  <script src="i18n.js"></script>
  <script src="converter.js"></script>
  <script src="converter-page.js"></script>
</body>
</html>
